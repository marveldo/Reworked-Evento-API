<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome To Evento</title>
</head>
<body style="margin:0; padding:0; background-color:#FFF7F2;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FFF7F2;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:100%; background-color:#FFFFFF; border-radius:12px; border:1px solid #F1D9CA;">
          <tr>
            <td style="padding:40px 40px 0 40px; font-family:Nunito, Arial, Helvetica, sans-serif; font-size:26px; font-weight:700; color:#E0580C;">
              {% if assets_url != "" %}
              <img src="{{ assets_url }}/evento-logo.png" width="160" alt="Evento" style="display:block; width:160px; height:auto; border:0;">
              {% else %}
              Evento
              {% endif %}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 40px 0 40px; font-family:Nunito, Arial, Helvetica, sans-serif; font-size:24px; font-weight:700; color:#1F2230;">
              Welcome To Evento, {{ full_name }}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 40px 0 40px; font-family:Nunito, Arial, Helvetica, sans-serif; font-size:16px; line-height:1.6; color:#1F2230;">
              Its so nice to have you. Create events, register for the ones you like and keep track of who's coming.
            </td>
          </tr>
          <tr>
            <td style="padding:32px 40px 0 40px;">
              <a href="{{ app_url }}/login" style="display:inline-block; padding:14px 28px; background-color:#E0580C; color:#FFFFFF; font-family:Nunito, Arial, Helvetica, sans-serif; font-size:16px; font-weight:700; text-decoration:none; border-radius:8px;">Log into your account</a>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 40px 40px 40px; font-family:Nunito, Arial, Helvetica, sans-serif; font-size:13px; line-height:1.6; color:#6B6F80;">
              If the button doesn't work, copy this link into your browser:<br>
              <a href="{{ app_url }}/login" style="color:#E0580C;">{{ app_url }}/login</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
